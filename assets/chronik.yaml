    headline: "So war die Rosskur"
    text: Wer am Wochenende vom 16. bis 18. Mai 2025 am Ortsausgang von Markelfingen in Richtung Allensbach vorbeikam, konnte einen ungewöhnlichen Anblick erleben Auf der Wiese standen zahlreiche Zelte und ein selbstgebautes Piratenboot. Es war der Start- und Zielbereich sowie Lagerplatz der Rosskur 2025, einem 24-Stunden-Stationenlauf für Pfadfinderinnen und Pfadfinder der ältesten Stufe in der DPSG (Deutsche Pfadfinder*innenschaft Sankt Georg), den sogenannten Rovern.\n\n{{< popup-button "/news/rosskur-bericht-2025/" "Mehr erfahren" >}}
