title:
  headline: Chronik des Stammes
events:
  - date: "1955"
    headline: Album Bender
    text: '{{< popup-button "/chronik-galerie/1950x-album-bender/" "Galerie anzeigen" >}}'
    media: /img/banner_round.webp
  - date: "1956"
    headline: Erster Stammeskurat
    text: Als erster Stammeskurat wurde dem Stamm Elmar Hettler zugeteilt.
  - date: "1956"
    headline: Bilder aus dem Jahr 1956
    text: '{{< popup-button "/chronik-galerie/1956/" "Galerie anzeigen" >}}'
    media: /img/banner_round.webp
  - date: "1956-04-03"
    headline: Gründung des Stammes
    text: |
      Gründung am 3. April durch Winfried Enz, Reinhold Bartosch, Walter Kramer, Guido Moriell, Lothar Fischer und Helmut Haselberger als Siedlung Wiking.
      Die erste Sippe bestand aus sechs Jungen und hieß „Silbermöwe".
  - date: "1956-04-07"
    headline: Erste Sippenstunde
    text: Die erste Sippenstunde des Stammes fand am 7. April statt.
  - date: "1956-04-28"
    headline: Erstes Gaulager
    text: Bereits kurz nach der Gründung nahm der Stamm am 28. April am ersten Gaulager teil.
  - date: "1956-09-07"
    headline: Erste Jungpfadfindersippe
    text: Am 7. September wurde die erste Jungpfadfindersippe gegründet.
  - date: "1956-09-21"
    headline: Zweite Jungpfadfindersippe
    text: Nur zwei Wochen nach der ersten wurde am 21. September bereits die zweite Jungpfadfindersippe gegründet.
  - date: "1957"
    headline: Bilder aus dem Jahr 1957
    text: '{{< popup-button "/chronik-galerie/1957/" "Galerie anzeigen" >}}'
    media: /img/banner_round.webp
  - date: 1957-01
    headline: Erstes Wölflingsrudel
    text: Ende Januar entstand das erste Wölflingsrudel des Stammes.
  - date: "1957-01-23"
    headline: 100. Geburtstag von Baden-Powell
    text: Gemeinsame Feier am 23. Januar mit dem Stamm des BDP zum 100. Geburtstag des Pfadfindergründers Lord Baden-Powell.
  - date: "1957-05-18"
    headline: Erstes gemeinsames Lager mit dem BDP
    text: Am 18. und 19. Mai fand das erste gemeinsame Lager mit dem Bund Deutscher Pfadfinder (BDP) statt.
  - date: "1957-07-01"
    headline: Anerkennung als Stamm St. Meinrad
    text: Am 1. Juli wurde die Siedlung Wiking offiziell als Stamm St. Meinrad anerkannt und bestätigt.
  - date: "1957-08-25"
    headline: Erstes Stammeslager
    text: Vom 25. bis 31. August wurde das erste Stammeslager durchgeführt.
  - date: "1957-12-15"
    headline: Erste Krippenausstellung
    text: Am 15. Dezember fand die erste Krippenausstellung statt.
  - date: "1958"
    headline: Bilder aus dem Jahr 1958
    text: '{{< popup-button "/chronik-galerie/1958/" "Galerie anzeigen" >}}'
    media: /img/banner_round.webp
  - date: "1958-01-28"
    headline: Neuer Stammeskurat
    text: Am 28. Januar wurde Vikar Christoph Burghardt als neuer Stammeskurat zugeteilt.
  - date: 1958-03
    headline: Erste Akela
    text: Seit März 1958 hat der Stamm eine Akela für die Wölflingsstufe.
  - date: "1959"
    headline: Papstaudienz der Rittergruppe
    text: Die Rittergruppe des Stammes hatte eine Audienz bei Papst Johannes XXIII.
  - date: "1959"
    headline: Bilder aus dem Jahr 1959
    text: '{{< popup-button "/chronik-galerie/1959/" "Galerie anzeigen" >}}'
    media: /img/banner_round.webp
  - date: "1960"
    headline: Bilder aus dem Jahr 1960
    text: '{{< popup-button "/chronik-galerie/1960/" "Galerie anzeigen" >}}'
    media: /img/banner_round.webp
  - date: "1960-12-04"
    headline: Altmaterialsammlung
    text: Vom 4. bis 10. Dezember fand eine Altmaterialsammlung zugunsten des „Speckpaters von Flandern" statt.
  - date: "1961-04-23"
    headline: Sondermarke zum Georgstag
    text: Zum Georgstag gab die Bundespost eine Sondermarke heraus, die St. Georg, den Schutzpatron der Pfadfinder, darstellt.
  - date: "1961-06-08"
    headline: Selbstständigkeit des Trupps St. Laurentius
    text: Im Führerring vom 8. Juni wurde der Trupp St. Laurentius als selbstständige Truppgemeinschaft mit eigenem Trupprat erklärt.
  - date: "1961-09-09"
    headline: Erstausgabe der Stammeszeitung
    text: Am 9. September erschien die erste Ausgabe der Stammeszeitung.
  - date: "1962"
    headline: Ernennung zum Hilfsfeldmeister
    text: Dieter Schneller erhielt als erstes Mitglied des Stammes die Ernennung zum Hilfsfeldmeister der DPSG.
  - date: "1962"
    headline: "Jahresaktion: Flinke Hände, flinke Füße"
    text: 'Teilnahme an der erstmals von der Bundesleitung durchgeführten Jahresaktion: „Flinke Hände, flinke Füße schaffen ein Werk für körperbehinderte Jugendliche".'
  - date: "1963"
    headline: Neuer Stammeskurat Klaus Schäfer
    text: Als neuer Kurat für den Stamm wurde Klaus Schäfer zugeteilt.
  - date: "1964"
    headline: Priesterjubiläum von Pfarrer E. Schmid
    text: 40-jähriges Priesterjubiläum des Roverkuraten Pfarrer E. Schmid.
  - date: "1964-01-26"
    headline: 7. Stammesthing
    text: Am 26. Januar wurde das 7. Stammesthing im „Haus der Jugend" abgehalten.
  - date: "1964-03-24"
    headline: Woodbadge-Rundenmeister Helmut Haselberger
    text: Am 24. März wurde Helmut Haselberger zum Woodbadge-Rundenmeister ernannt.
  - date: "1964-04-19"
    headline: Neuer Stammesführer Siegfried Müller
    text: Am 19. April wurde Siegfried Müller (Käppi) zum neuen Stammesführer gewählt.
  - date: "1965-02-15"
    headline: Woodbadge-Feldmeister Siegfried Müller
    text: Am 15. Februar wurde Siegfried Müller zum Woodbadge-Feldmeister ernannt.
  - date: "1966"
    headline: Entwicklungsdienst im Kongo
    text: Stammesmitglied Kurt Fricker geht als Entwicklungshelfer in den Kongo.
  - date: "1967-03-05"
    headline: 10-jähriges Bestehen
    text: Begeisternder Elternabend am 5. März zum 10-jährigen Bestehen des Stammes Radolfzell im Scheffelhof.
  - date: "1967-03-28"
    headline: Aktion Flinke Hände, flinke Füße
    text: Vom 28. März bis 9. April wurde die Aktion „Flinke Hände, flinke Füße" erstmals gemeinsam mit der PSG durchgeführt.
  - date: 1967-09
    headline: Neuer Stammeskurat Wolfgang Oberschmidt
    text: Im September wurde dem Stamm Wolfgang Oberschmidt als neuer Stammeskurat zugeteilt.
  - date: "1968-01-28"
    headline: Wahl des Stammesführers
    text: Beim Stammesthing am 28. Januar wurde Helmut Haselberger erneut zum Stammesführer gewählt.
  - date: "1968-03-30"
    headline: Erstes Versprechen in Allensbach
    text: Am 30. März legten acht Pfadfinder der „Außenstelle" Allensbach ihr erstes Versprechen ab.
  - date: "1969"
    headline: Unterstützung für Entwicklungshelfer Kurt Fricker
    text: An Ostern wurde die Aktion „Flinke Hände, flinke Füße" für den Entwicklungshelfer Kurt Fricker im Kongo durchgeführt.
  - date: "1970"
    headline: Umbenennung in Stamm Impeesa
    text: Der ursprüngliche Name 'Siedlung Wiking' wurde in 'Stamm Impeesa' geändert. _Impeesa_ war der Spitzname des Pfadfindergründers Lord Baden-Powell und bedeutet übersetzt 'der Wolf, der nie schläft'.
