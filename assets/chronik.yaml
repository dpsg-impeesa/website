    headline: "Jungpfadfinderlager 2024"
    text: Am Montag, den 26. August, machten sich die Jungpfadfinder aus Markelfingen auf den Weg zum diesjährigen Sommerlager.  Voller Vorfreude ging es morgens um 8 Uhr mit der Bahn los zum Lagerplatz. Und welch ein Glück, ohne Verspätungen erreichten alle pünktlich zum Mittagessen Gutenstein an der Donau.  Angekommen am Lagerplatz erwartete uns eine Überraschung. Halva, ein echter Wikinger, begrüßte die Kinder und gab ihnen eine Einführung zu ihrem neuen Wikingerdorf, in dem wir gemeinsam die nächsten zwei Wochen verbringen würden. Und natürlich darf dabei das Einrichten nicht fehlen!\n\n{{< popup-button "/news/jufi-sommerlager-2024/" "Mehr erfahren" >}}
