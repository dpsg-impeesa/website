    headline: "Jufilager 2025 🇨🇭"
    text: Sommerlager 2025 in der Schweiz 12 Tage voller Abenteuer, Schlümpfe und Lagerfeuer! Endlich war es so weit! Unser diesjähriges Sommerlager führte uns für 12 unvergessliche Tage in die wunderschöne Schweiz. Vollgepackt mit Vorfreude und Abenteuerlust starteten wir unsere Reise mit dem Zug nach Gonten und legten die letzte Etappe zu unserem Lagerplatz zu Fuß zurück. Kaum waren die Zelte und die Küche aufgebaut, wurden wir von einem heftigen Unwetter überrascht. Doch echte Pfadfinder lassen sich davon nicht unterkriegen!\n\n{{< popup-button "/news/jufilager-2025/" "Mehr erfahren" >}}
