    headline: "Wanderlager der Pfadis 2024"
    text: Die Gruppe der Pfadistufe war diese Sommerferien auf einem Wanderlager in der Bretagne. Das heißt, alles was täglich benötigt wird muss in Wanderrucksäcken mit sich getragen werden. Zelte, Schlafsäcke und Isomatten, aber auch Essen, Töpfe und Geschirr. Außerdem musste sich jeden Abend erneut auf die suche nach einem Schlafplatz gemacht werden.\n\n{{< popup-button "/news/wanderlager-2024/" "Mehr erfahren" >}}
