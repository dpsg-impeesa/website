    headline: "Umbenennung in Stamm Impeesa"
    text: "Der ursprüngliche Name 'Siedlung Wiking' wurde in 'Stamm Impeesa' geändert. _Impeesa_ war der Spitzname des Pfadfindergründers Lord Baden-Powell und bedeutet übersetzt 'der Wolf, der nie schläft'."

  # exported news posts
  - date: "2026-06-05"
    headline: "Stammeslager 2026"
    text: "Am Mittwochnachmittag starteten die Wölflinge per Zug, während die Jufis bis Rover sich mit dem Fahrrad auf den Weg zum Lagerplatz nach Litzelstetten machten. Kaum angekommen, wurde direkt mit dem Aufbau der Zelte begonnen. Nach der getanen Arbeit stärkten sich alle mit Spaghetti und Tomatensoße, bevor der Abend mit einer lustigen Runde „Mein Leiter kann“ gemütlich beendet wurde.\n\n[Mehr erfahren](/news/stammeslager-2026/)"
    media: "/images/upload/2026/Gruppenbild_Stala.webp"
  - date: "2025-12-06"
    headline: "Friedenslicht Delegationsfahrt nach Linz 🕯️"
    text: "Letztes Jahr ging es für 3 von uns Leitern zur Internationalen Friedenslicht Aussendungsfeier nach Linz, die am 6.12.2025 im Mariendom stattfand. Los ging es morgens am 5. mit dem Zug von Radolfzell bis nach Linz, wo wir abends ankamen. Nach der Ankunft gab es noch ein leckeres Abendessen in einem traditionell österreichischen Restaurant. Übernachtet haben wir in einer Turnhalle zusammen mit den anderen deutschen Teilnehmern.\n\n[Mehr erfahren](/news/friedenslicht-2025/)"
    media: "/images/upload/2026/GroupPicture.webp"
  - date: "2025-10-05"
    headline: "Pfadilager Hanseradweg 2025 🇳🇱"
    text: "Unser Pfadilager 2025 war eine unvergessliche Fahrradtour von Duisburg bis Amsterdam. Über elf ereignisreiche Tage erlebten wir - eine Gruppe von zwölf Personen, darunter zehn Pfadis und zwei Leiter - ein Abenteuer voller Herausforderungen, Gemeinschaftserlebnisse und kultureller Entdeckungen. Die Tour führte uns entlang des Rheins bis zur Niederländischen Grenze, weiter durch malerische Landschaften und historische Städte entlang der Ijsel und der Zuiderseen bis Nach Amsterdam. Insgesamt legten wir 370 Kilometer auf dem Fahrrad zurück.\n\n[Mehr erfahren](/news/hanseradweg-2025/)"
    media: "/images/upload/2025/hanseradweg_allee.webp"
  - date: "2025-10-04"
    headline: "Wölflingslager 2025"
    text: "Am Samstag den 6.9. haben wir uns am Vormittag getroffen und schon ging es los Richtung St. Georgen in den Schwarzwald. Kaum angekommen und schnell wurde fleißig fürs Mittagessen geschnippelt. Es folgten ein paar organisatorische Dinge wie zB. die Zimmeraufteilung oder die Regeln. Nach ein bisschen Freizeit und Erkundung der Gegend gab es dann auch schon Nudeln mit Tomatensoße zum Abendessen. Schließlich noch die Abendrunde und eine Gutenachtgeschichte und der erste Tag war auch wieder vorüber.\n\n\n[Mehr erfahren](/news/woelflingslager-2025/)"
    media: "/images/upload/2025/WöLa25-Gruppenbild.webp"
  - date: "2025-09-22"
    headline: "Jufilager 2025 🇨🇭"
    text: "Sommerlager 2025 in der Schweiz: 12 Tage voller Abenteuer, Schlümpfe und Lagerfeuer! Endlich war es so weit! Unser diesjähriges Sommerlager führte uns für 12 unvergessliche Tage in die wunderschöne Schweiz. Vollgepackt mit Vorfreude und Abenteuerlust starteten wir unsere Reise mit dem Zug nach Gonten und legten die letzte Etappe zu unserem Lagerplatz zu Fuß zurück. Kaum waren die Zelte und die Küche aufgebaut, wurden wir von einem heftigen Unwetter überrascht. Doch echte Pfadfinder lassen sich davon nicht unterkriegen!\n\n[Mehr erfahren](/news/jufilager-2025/)"
    media: "/images/upload/2025/JUFILAGER25Title.webp"
  - date: "2025-09-22"
    headline: "CrOver 2025 🇸🇰"
    text: "Ein großer Teil unserer Roverrunde war vom 8. bis 17. August 2025 auf dem „CrOver“ in der Slowakei. Das war ein Lager für alle Rover und Roverinnen aus der Region Mitte, zusätzlich haben uns auf dem Lagerplatz aber auch einige slowakische PfadfinderInnen besucht. Das Lager war das Abschlusslager eines Projekts, das im vergangenen Oktober mit einem Auftaktwochenende in Mannheim gestartet hatte und uns so in die Projektphase eingeführt hat. Das Ziel war es, während der Projektphase so viel CO2 einzusparen, dass das Abschlusslager im Endeffekt CO2-neutral war.\n\n\n[Mehr erfahren](/news/crover-2025/)"
    media: "/images/upload/2025/CroverGroup.webp"
  - date: "2025-06-05"
    headline: "So war die Rosskur"
    text: "Wer am Wochenende vom 16. bis 18. Mai 2025 am Ortsausgang von Markelfingen in Richtung Allensbach vorbeikam, konnte einen ungewöhnlichen Anblick erleben: Auf der Wiese standen zahlreiche Zelte und ein selbstgebautes Piratenboot. Es war der Start- und Zielbereich sowie Lagerplatz der Rosskur 2025, einem 24-Stunden-Stationenlauf für Pfadfinderinnen und Pfadfinder der ältesten Stufe in der DPSG (Deutsche Pfadfinder*innenschaft Sankt Georg), den sogenannten Rovern.\n\n[Mehr erfahren](/news/rosskur-bericht-2025/)"
    media: "/images/galerie/rosskur/IMG_7889.webp"
  - date: "2025-03-29"
    headline: "Rosskur in Markelfingen am Bodensee"
    text: "“Rover of the Carribean” ist das Motto der Rosskur, die dieses Jahr von uns organisiert wird. Doch wie kommt es dazu? Wer kann daran teilnehmen und was ist bitte eine Rosskur?\n\n[Mehr erfahren](/news/rosskur-2025/)"
    media: "/images/upload/2025/Rosskur2025.webp"
  - date: "2025-03-26"
    headline: "Dorfgauditunier 2025"
    text: "Am Samstag, 28. Juni 2025 findet in Markelfingen das diesjjhrige Dorfgauditurnier statt. Gemeinsam mit dem SV Markelfingen sorgen wir als Pfadfinder dort für ein unterhaltsames Turnier in dem Teams in den Disziplinen Wasserbomben-Volleyball, menschliches Tischkicker und Bubble-Fußball gegeneinander antreten werden. Wir freuen uns auf einen Tag voller Spaß und guter Laune!\nDas Tunier get von 10:00 bis 17:00 Uhr und findet am Riedstadion in Markelfingen statt. Anschließend ist ab 18:00 Uhr Party mit Live Band.\n\n\n[Mehr erfahren](/news/dorfgauditunier-2025/)"
    media: "/images/upload/2025/gauditunier.webp"
  - date: "2024-11-30"
    headline: "Wanderlager der Pfadis 2024"
    text: "Die Gruppe der Pfadistufe war diese Sommerferien auf einem Wanderlager in der Bretagne. Das heißt, alles was täglich benötigt wird muss in Wanderrucksäcken mit sich getragen werden: Zelte, Schlafsäcke und Isomatten, aber auch Essen, Töpfe und Geschirr. Außerdem musste sich jeden Abend erneut auf die suche nach einem Schlafplatz gemacht werden.\n\n[Mehr erfahren](/news/wanderlager-2024/)"
    media: "/images/upload/2024/2024-08-29_10-08-00_Best0fWanderlager.jpg"
  - date: "2024-11-18"
    headline: "Jungpfadfinderlager 2024"
    text: "Am Montag, den 26. August, machten sich die Jungpfadfinder aus Markelfingen auf den Weg zum diesjährigen Sommerlager.  Voller Vorfreude ging es morgens um 8 Uhr mit der Bahn los zum Lagerplatz. Und welch ein Glück, ohne Verspätungen erreichten alle pünktlich zum Mittagessen Gutenstein an der Donau.  Angekommen am Lagerplatz erwartete uns eine Überraschung. Halva, ein echter Wikinger, begrüßte die Kinder und gab ihnen eine Einführung zu ihrem neuen Wikingerdorf, in dem wir gemeinsam die nächsten zwei Wochen verbringen würden. Und natürlich darf dabei das Einrichten nicht fehlen!\n\n[Mehr erfahren](/news/jufi-sommerlager-2024/)"
    media: "/images/upload/2024/P1050589.webp"
  - date: "2024-11-18"
    headline: "Wölflingslager 2024"
    text: "Am Samstag, den 31. August sind wir in Nöggenschwiel im Pfadiheim angekommen und haben unser Gepäck in die Zimmer gebracht. Alle hatten erstmal Freizeit und durften spielen. Nach dem Essen und einer Abendrunde hörten wir noch eine Geschichte und gingen schlafen.\n\n[Mehr erfahren](/news/woelflingslager-2024/)"
    media: "/images/upload/2024/image0.jpeg"
  - date: "2024-09-10"
    headline: "Roverway 2024 🇳🇴"
    text: "Vom 19.07. bis zum 03.08.2024 war ein Teil unserer Roverrunde auf dem diesjährigen Roverway in Norwegen. Das Roverway ist ein internationales Pfadfinderlager, das in der Regel alle 4 Jahre stattfindet, bei dem Pfadfinder und Pfadfinderinnen aus ganz Europa aber auch den anderen Teilen der Welt zusammenkommen.\nDieses Jahr waren insgesamt ca. 5500 Menschen dabei. Das Lager war für uns in drei verschiedenen Teile aufgeteilt:\nDie ersten drei Tage waren wir gemeinsam mit dem gesamten deutschen Kontingent (ca. 270 Personen) auf einem Zeltplatz in Fredrikstad im Süd-Osten von Norwegen. Dort hatten wir viel Zeit die anderen deutschen Teilnehmenden kennenzulernen und schon mal ein bisschen von Norwegen zu erkunden.\n\n\n[Mehr erfahren](/news/roverway-2024/)"
    media: "/images/upload/2024/Roverway24-2024-07-27_21-47-38_Freddy-Handy.webp"
  - date: "2024-07-02"
    headline: "1300 Jahr Feier"
    text: "Am 06.und 07.07 findet in Markelfingen ein Festwochenende im Rahmen des 1300-jährigen Dorfjubiläums, statt.\nNeben viel Programm, dass sich thematisch rund um Markelfingen dreht, gibt es auch eine Festmeile mit verschiedenen Ständen.\nAuch wir werden mit unserem Stand ein Teil der Festmeile sein. Sowohl Kulinarik, als auch Entertainment kommt bei uns nicht zu kurz: Unser Essenstand hat ein vielfältiges Angebot und bietet z.B. Quiche, Salate, Crêpes, Eis und Kuchen. Auch für Getränke ist natürlich gesorgt.\nAußerdem wird es auf der Pfarrwiese ein Kinder-Spieleangebot geben. Neben einer Kletterwand, einer Fußball-Darts-Scheibe und vielem mehr, wird es am Samstag auch einen auftritt von einem Zauberer geben.\nDie Festmeile wird Samstag ab 11:30 Uhr eröffnet und wird Sonntag ab 10 Uhr wieder fortgesetzt. Zu finden sind wir auf der Pfarrwiese hinter dem Pfarrheim (Laurentiusstraße 9).\nWir freuen uns über alle, die vorbeikommen!\n\n\n[Mehr erfahren](/news/1300-jahr-feier-2024/)"
    media: "/images/upload/2024/1300-jahre-markelfingen.png"
  - date: "2024-06-05"
    headline: "Dorfgauditunier"
    text: "Am 29. Juni 2024 findet in Markelfingen das Dorfgauditurnier statt. Gemeinsam mit dem SV Markelfingen sorgen wir als Pfadfinder dort für ein unterhaltsames Turnier in dem Teams in den Disziplinen Wasserbomben-Volleyball, menschliches Tischkicker und Bubble-Fußball gegeneinander antreten werden. Wir freuen uns auf einen Tag voller Spaß und guter Laune!\n\n\n[Mehr erfahren](/news/dorfgauditunier-2024/)"
    media: "/images/upload/2024/Dorfgauditurnier-Plakat.webp"
  - date: "2024-04-18"
    headline: "72 Stunden Aktion 2024"
    text: "Einen schönen Platz im Römerstil mit etwas Natur in Markelfingen zu schaffen, ist unser Ziel der 72 Stunden Aktion. Außerdem fertigen wir Sitzgelegenheiten für einen Grillplatz in Güttingen an. Der Römerplatz soll aus mehreren Bänken, Bäumen und 2 Mosaiken im Boden bestehen.\n\n[Mehr erfahren](/news/72h-aktion-2024/)"
    media: "/images/upload/2024/72h/gruppenbild.jpg"
  - date: "2023-03-19"
    headline: "Spendenlauf - Jahresaktion 2023"
    text: "Wir laden alle Motivierten, egal ob Sportskanonen, Hobbysportler oder Sportmuffel, zu unserem Spendenlauf ein. Drei Stunden hast Du Zeit, möglichst viele Runden à 650 Meter zu laufen, walken, joggen oder rennen. Du tust etwas Gutes für Deine Gesundheit und sammelst gleichzeitig mit jeder gelaufenen Runde Spenden für den Bau einer Schule in Ghana. Mehr Infos zu dem Projekt findest Du hier.\n\n[Mehr erfahren](/news/spendenlauf-2023/)"
    media: "/images/upload/2023/Plakat-1-conv-1-1.jpeg"
  - date: "2022-05-16"
    headline: "Spendenlauf - Jahresaktion 2022"
    text: "Laufen für den guten Zweck:\nWir laden alle Motivierten, egal ob Sportskanonen, Hobbysportler oder Sportmuffel, zu unserem Spendenlauf ein. Drei Stunden hast Du Zeit, möglichst viele Runden à 650 Meter zu laufen, walken, joggen oder rennen. Du tust etwas Gutes für Deine Gesundheit und sammelst gleichzeitig mit jeder gelaufenen Runde Spenden für unsere Partnergemeinde Sicuani in Peru.\nMehr Infos zu Sicuani findest Du hier.\nWie funktioniert das genau? Teilnehmen kannst Du ganz einfach:\n\n\n[Mehr erfahren](/news/spendenlauf-2022/)"
    media: "/images/upload/2022/0001.webp"
  - date: "2021-07-04"
    headline: "Vorstellung Jufitrupp"
    text: "Hallo wir sind die Jungpfadfinder,\nwir sind in der 5.,6. Oder 7. Klasse und treffen uns immer Montag Abend von 18:15 Uhr bis 19:45 Uhr im Pfarrheim in Markelfingen. Wir starten unsere Truppstunde mit einer von den Trüpplingen vorbereiteten Einleitung. Anschließend machen wir gemeinsam Spiele, sind viel draußen, planen und führen Aktionen und Projekte durch und haben viel Spaß zusammen. Das Highlight des Jahres stellt unser Sommerlager dar, bei dem wir ca. 2 Wochen Zelten gehen und an selbstgebauten Küchen kochen werden.\n\n\n[Mehr erfahren](/news/jufi-vorstellung-2021/)"
    media: "/images/upload/2021/WhatsApp-Image-2021-07-06-at-20.20.04.jpeg"
  - date: "2021-06-28"
    headline: "Vorstellung Wölflingsmeute"
    text: "Hallo, wir sind die Wölflinge!\nIhr findet uns jede Woche am Dienstag von 18:00 Uhr bis 19:30 Uhr auf der Pfarrwiese oder im Pfarrheim in Markelfingen.\nDie meiste Zeit spielen wir coole Spiele oder machen tolle Projekte, wie beispielsweise der Bau von einem großen Insektenhotel.\nWir Kinder besuchen die zweite, dritte oder vierte Klasse einer Grundschule.\nUnser Highlight im Pfadijahr ist definitiv das Sommerlager, auf welchem wir eine Woche lang Abenteuer in einem Haus erleben und als Gruppe noch weiter zusammenwachsen.\n\n\n[Mehr erfahren](/news/woelflinge-vorstellung-2021/)"
    media: "/images/upload/2021/IMG-20210628-WA0001.webp"
  - date: "2019-08-01"
    headline: "72 Stunden Aktion 2019"
    text: "Die Diesjährige 72 Stunden Aktion war ein voller Erfolg. In kürzester Zeit bauten wir eine Schutzhütte auf dem Kohlplatz in Markelfingen. Vom 23.5.-26.5. hatten wir dafür Zeit.\n\n[Mehr erfahren](/news/72h-aktion-2019/)"
    media: "/images/upload/2019/logo-72-stunden-aktion-datum-gruen.webp"
