    text: Bei der Rosskur in Bruchsal erzielte das Team aus Markelfingen die meisten Punkte. Daher findet die Rosskur 2025 bei uns statt. Die Rosskur 2024 war unter dem Motto "Super Mario"
  - date: "2024-06-29"
    headline: Dorfgauditunier
    text: |-
      Am 29. Juni 2024 findet in Markelfingen das Dorfgauditurnier statt.
      Gemeinsam mit dem SV Markelfingen sorgen wir als Pfadfinder dort für ein unterhaltsames Turnier in dem Teams in den Disziplinen
      Wasserbomben-Volleyball, menschliches Tischkicker und Bubble-Fußball gegeneinander antreten werden.
      Wir freuen uns auf einen Tag voller Spaß und guter Laune!

      {{< popup-button "/news/dorfgauditunier-2024/" "Mehr infos" >}}
    media: /images/upload/2024/Dorfgauditurnier-Plakat.webp
  - date: "2024-07-06"
    headline: 1300 Jahr Feier
    text: |-
      Am 06. und 07.07 findet in Markelfingen ein Festwochenende im Rahmen des 1300-jährigen Dorfjubiläums, statt.
      Neben viel Programm, dass sich thematisch rund um Markelfingen dreht, gibt es auch eine Festmeile mit verschiedenen Ständen.
      Auch wir werden mit unserem Stand ein Teil der Festmeile sein.
      Sowohl Kulinarik, als auch Entertainment kommt bei uns nicht zu kurz.

      {{< popup-button "/news/1300-jahr-feier-2024/" "Mehr infos" >}}
    media: /images/upload/2024/1300-jahre-markelfingen.png
  - date: "2024-07-19"
    end: "2024-08-03"
    headline: Roverway 2024 🇳🇴
    text: |-
      Vom 19.07. bis zum 03.08.2024 war ein Teil unserer Roverrunde auf dem diesjährigen Roverway in Norwegen.
      Das Roverway ist ein internationales Pfadfinderlager, das in der Regel alle 4 Jahre stattfindet, bei dem Pfadfinder und Pfadfinderinnen aus ganz Europa aber auch den anderen Teilen der Welt zusammenkommen.
      Dieses Jahr waren insgesamt ca. 5500 Menschen dabei. Das Lager war für uns in drei verschiedenen Teile aufgeteilt: Die ersten drei Tage waren wir gemeinsam mit dem gesamten deutschen Kontingent (ca. 270 Personen) auf einem Zeltplatz in Fredrikstad im Süd-Osten von Norwegen.
      Dort hatten wir viel Zeit die anderen deutschen Teilnehmenden kennenzulernen und schon mal ein bisschen von Norwegen zu erkunden.

      {{< popup-button "/news/roverway-2024/" "Mehr infos" >}}
    media: /images/upload/2024/Roverway24-2024-07-27_21-47-38_Freddy-Handy.webp
  - date: "2024-08-26"
    headline: Jungpfadfinderlager 2024
    text: |-
      Am Montag, den 26. August, machten sich die Jungpfadfinder aus Markelfingen auf den Weg zum diesjährigen Sommerlager.
      Voller Vorfreude ging es morgens um 8 Uhr mit der Bahn los zum Lagerplatz. Und welch ein Glück, ohne Verspätungen erreichten alle pünktlich zum Mittagessen Gutenstein an der Donau.
      Angekommen am Lagerplatz erwartete uns eine Überraschung. Halva, ein echter Wikinger, begrüßte die Kinder und gab ihnen eine Einführung zu ihrem neuen Wikingerdorf,
      in dem wir gemeinsam die nächsten zwei Wochen verbringen würden. Und natürlich darf dabei das Einrichten nicht fehlen!

      {{< popup-button "/news/jufi-sommerlager-2024/" "Mehr infos" >}}
    media: /images/upload/2024/P1050589.webp
  - date: "2024-08-27"
    end: "2024-09-07"
    headline: Wanderlager der Pfadis 2024
    text: |-
      Die Gruppe der Pfadistufe war diese Sommerferien auf einem Wanderlager in der Bretagne.
      Das heißt, alles war täglich benötigt wird muss in Wanderrucksäcken mit sich getragen werden.
      Zelte, Schlafsäcke und Isomatten, aber auch Essen, Töpfe und Geschirr.
      Außerdem musste sich jeden Abend erneut auf die suche nach einem Schlafplatz gemacht werden.

      {{< popup-button "/news/wanderlager-2024/" "Mehr infos" >}}
    media: /images/upload/2024/2024-08-29_10-08-00_Best0fWanderlager.jpg
  - date: "2024-08-31"
    end: "2024-09-06"
    headline: Wölflingslager 2024
    text: |-
      Am Samstag, den 31. August sind wir in Nöggenschwiel im Pfadiheim angekommen und haben unser Gepäck in die Zimmer gebracht.
      Alle hatten erstmal Freizeit und durften spielen.
      Nach dem Essen und einer Abendrunde hörten wir noch eine Geschichte und gingen schlafen.

