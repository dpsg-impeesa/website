    headline: "Stammeslager 2026"
    text: Am Mittwochnachmittag starteten die Wölflinge per Zug, während die Jufis bis Rover sich mit dem Fahrrad auf den Weg zum Lagerplatz nach Litzelstetten machten. Kaum angekommen, wurde direkt mit dem Aufbau der Zelte begonnen. Nach der getanen Arbeit stärkten sich alle mit Spaghetti und Tomatensoße, bevor der Abend mit einer lustigen Runde „Mein Leiter kann“ gemütlich beendet wurde.\n\n{{< popup-button "/news/stammeslager-2026/" "Mehr erfahren" >}}
