    headline: "Friedenslicht Delegationsfahrt nach Linz 🕯️"
    text: Letztes Jahr ging es für 3 von uns Leitern zur Internationalen Friedenslicht Aussendungsfeier nach Linz, die am 6.12.2025 im Mariendom stattfand. Los ging es morgens am 5. mit dem Zug von Radolfzell bis nach Linz, wo wir abends ankamen. Nach der Ankunft gab es noch ein leckeres Abendessen in einem traditionell österreichischen Restaurant. Übernachtet haben wir in einer Turnhalle zusammen mit den anderen deutschen Teilnehmern.\n\n{{< popup-button "/news/friedenslicht-2025/" "Mehr erfahren" >}}
