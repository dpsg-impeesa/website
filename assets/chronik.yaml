    media: /images/galerie/rosskur/IMG_7889.webp
  - date: "2025-06-28"
    headline: Dorfgauditunier 2025
    text: |-
      Am Samstag, 28. Juni 2025 findet in Markelfingen das diesjjhrige Dorfgauditurnier statt.
      Gemeinsam mit dem SV Markelfingen sorgen wir als Pfadfinder dort für ein unterhaltsames Turnier in dem Teams in den Disziplinen Wasserbomben-Volleyball, menschliches Tischkicker und Bubble-Fußball gegeneinander antreten werden.
      Wir freuen uns auf einen Tag voller Spaß und guter Laune! Das Tunier get von 10:00 bis 17:00 Uhr und findet am Riedstadion in Markelfingen statt.
      Anschließend ist ab 18:00 Uhr Party mit Live Band.

      {{< popup-button "/news/dorfgauditunier-2025/"  "Mehr infos" >}}
    media: /images/upload/2025/gauditunier.webp
  - date: "2025-08-08"
    end: "2025-08-17"
    headline: CrOver 2025 🇸🇰
    text: |-
      Ein großer Teil unserer Roverrunde war vom 8. bis 17. August 2025 auf dem „CrOver“ in der Slowakei.
      Das war ein Lager für alle Rover und Roverinnen aus der Region Mitte, zusätzlich haben uns auf dem Lagerplatz aber auch einige slowakische PfadfinderInnen besucht.
      Das Lager war das Abschlusslager eines Projekts, das im vergangenen Oktober mit einem Auftaktwochenende in Mannheim gestartet hatte und uns so in die Projektphase eingeführt hat.
      Das Ziel war es, während der Projektphase so viel CO2 einzusparen, dass das Abschlusslager im Endeffekt CO2-neutral war.

      {{< popup-button "/news/crover-2025/"  "Mehr infos" >}}
    media: /images/upload/2025/CroverGroup.webp
  - date: "2025-09-01"
    end: "2025-09-11"
    headline: Pfadfinderlager Hanseradweg 2025 🇳🇱
    text: |-
      Unser Pfadfinderlager 2025 war eine unvergessliche Fahrradtour von Duisburg bis Amsterdam.
      Über elf ereignisreiche Tage erlebten wir - eine Gruppe von zwölf Personen, darunter zehn Pfadis und zwei Leiter - ein Abenteuer voller Herausforderungen, Gemeinschaftserlebnisse und kultureller Entdeckungen.
      Die Tour führte uns entlang des Rheins bis zur Niederländischen Grenze, weiter durch malerische Landschaften und historische Städte entlang der Ijsel und der Zuiderseen bis Nach Amsterdam.
      Insgesamt legten wir 370 Kilometer auf dem Fahrrad zurück.

      {{< popup-button "/news/hanseradweg-2025/"  "Mehr infos" >}}
    media: /images/upload/2025/hanseradweg_allee.webp
  - date: "2025-09-01"
    headline: Jungpfadfinderlager 2025 🇨🇭
    text: |-
      Sommerlager 2025 in der Schweiz 12 Tage voller Abenteuer, Schlümpfe und Lagerfeuer!
      Endlich war es so weit! Unser diesjähriges Sommerlager führte uns für 12 unvergessliche Tage in die wunderschöne Schweiz.
      Vollgepackt mit Vorfreude und Abenteuerlust starteten wir unsere Reise mit dem Zug nach Gonten und legten die letzte Etappe zu unserem Lagerplatz zu Fuß zurück.
      Kaum waren die Zelte und die Küche aufgebaut, wurden wir von einem heftigen Unwetter überrascht. Doch echte Pfadfinder lassen sich davon nicht unterkriegen!

      {{< popup-button "/news/jufilager-2025/"  "Mehr infos" >}}
    media: /images/upload/2025/JUFILAGER25Title.webp
  - date: "2025-09-06"
    headline: Wölflingslager 2025
    text: |-
      Am Samstag den 6.9. haben wir uns am Vormittag getroffen und schon ging es los Richtung St. Georgen in den Schwarzwald.
      Kaum angekommen und schnell wurde fleißig fürs Mittagessen geschnippelt. Es folgten ein paar organisatorische Dinge wie zB. die Zimmeraufteilung oder die Regeln.
      Nach ein bisschen Freizeit und Erkundung der Gegend gab es dann auch schon Nudeln mit Tomatensoße zum Abendessen.
      Schließlich noch die Abendrunde und eine Gutenachtgeschichte und der erste Tag war auch wieder vorüber.

      {{< popup-button "/news/woelflingslager-2025/"  "Mehr infos" >}}
    media: /images/upload/2025/WöLa25-Gruppenbild.webp
  - date: 2025-12
    headline: Wallfahrt
    text: '{{< popup-button "/chronik-galerie/2025-wallfahrt/" "Galerie anzeigen" >}}'
