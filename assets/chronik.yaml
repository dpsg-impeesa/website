    headline: "CrOver 2025 🇸🇰"
    text: Ein großer Teil unserer Roverrunde war vom 8. bis 17. August 2025 auf dem „CrOver“ in der Slowakei. Das war ein Lager für alle Rover und Roverinnen aus der Region Mitte, zusätzlich haben uns auf dem Lagerplatz aber auch einige slowakische PfadfinderInnen besucht. Das Lager war das Abschlusslager eines Projekts, das im vergangenen Oktober mit einem Auftaktwochenende in Mannheim gestartet hatte und uns so in die Projektphase eingeführt hat. Das Ziel war es, während der Projektphase so viel CO2 einzusparen, dass das Abschlusslager im Endeffekt CO2-neutral war.\n\n\n{{< popup-button "/news/crover-2025/" "Mehr erfahren" >}}
