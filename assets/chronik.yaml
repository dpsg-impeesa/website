    headline: "Wölflingslager 2025"
    text: Am Samstag den 6.9. haben wir uns am Vormittag getroffen und schon ging es los Richtung St. Georgen in den Schwarzwald. Kaum angekommen und schnell wurde fleißig fürs Mittagessen geschnippelt. Es folgten ein paar organisatorische Dinge wie zB. die Zimmeraufteilung oder die Regeln. Nach ein bisschen Freizeit und Erkundung der Gegend gab es dann auch schon Nudeln mit Tomatensoße zum Abendessen. Schließlich noch die Abendrunde und eine Gutenachtgeschichte und der erste Tag war auch wieder vorüber.\n\n\n{{< popup-button "/news/woelflingslager-2025/" "Mehr erfahren" >}}
