  - date: "2024-07-06"
    headline: "1300 Jahr Feier"
    text: Am 06.und 07.07 findet in Markelfingen ein Festwochenende im Rahmen des 1300-jährigen Dorfjubiläums, statt.\nNeben viel Programm, dass sich thematisch rund um Markelfingen dreht, gibt es auch eine Festmeile mit verschiedenen Ständen.\nAuch wir werden mit unserem Stand ein Teil der Festmeile sein. Sowohl Kulinarik, als auch Entertainment kommt bei uns nicht zu kurz. Unser Essenstand hat ein vielfältiges Angebot und bietet z.B. Quiche, Salate, Crêpes, Eis und Kuchen. Auch für Getränke ist natürlich gesorgt.\nAußerdem wird es auf der Pfarrwiese ein Kinder-Spieleangebot geben. Neben einer Kletterwand, einer Fußball-Darts-Scheibe und vielem mehr, wird es am Samstag auch einen auftritt von einem Zauberer geben.\nDie Festmeile wird Samstag ab 11:30 Uhr eröffnet und wird Sonntag ab 10 Uhr wieder fortgesetzt. Zu finden sind wir auf der Pfarrwiese hinter dem Pfarrheim (Laurentiusstraße 9).\nWir freuen uns über alle, die vorbeikommen!\n\n\n{{< popup-button "/news/1300-jahr-feier-2024/" "Mehr erfahren" >}}
