    headline: Rosskur Trailer
    text: |-
      "Rover of the Carribean" ist das Motto der Rosskur, die dieses Jahr von uns organisiert wird.
      Doch wie kommt es dazu? Wer kann daran teilnehmen und was ist bitte eine Rosskur?

      {{< popup-button "/news/rosskur-2025/" "Mehr infos" >}}
    media: https://www.youtube.com/watch?v=c1hPXJ-CM34
  - date: "2025-05-16"
    end: "2025-05-18"
    headline: So war die Rosskur
    text: |-
      Wer am Wochenende vom 16. bis 18. Mai 2025 am Ortsausgang von Markelfingen in Richtung Allensbach vorbeikam, konnte einen ungewöhnlichen Anblick erleben Auf der Wiese standen zahlreiche Zelte und ein selbstgebautes Piratenboot.
      Es war der Start- und Zielbereich sowie Lagerplatz der Rosskur 2025, einem 24-Stunden-Stationenlauf für Pfadfinderinnen und Pfadfinder der ältesten Stufe in der DPSG, den sogenannten Rovern.

      {{< popup-button "/news/rosskur-bericht-2025/" "Mehr infos" >}}
