    headline: "Roverway 2024 🇳🇴"
    text: Vom 19.07. bis zum 03.08.2024 war ein Teil unserer Roverrunde auf dem diesjährigen Roverway in Norwegen. Das Roverway ist ein internationales Pfadfinderlager, das in der Regel alle 4 Jahre stattfindet, bei dem Pfadfinder und Pfadfinderinnen aus ganz Europa aber auch den anderen Teilen der Welt zusammenkommen.\nDieses Jahr waren insgesamt ca. 5500 Menschen dabei. Das Lager war für uns in drei verschiedenen Teile aufgeteilt:\nDie ersten drei Tage waren wir gemeinsam mit dem gesamten deutschen Kontingent (ca. 270 Personen) auf einem Zeltplatz in Fredrikstad im Süd-Osten von Norwegen. Dort hatten wir viel Zeit die anderen deutschen Teilnehmenden kennenzulernen und schon mal ein bisschen von Norwegen zu erkunden.\n\n\n{{< popup-button "/news/roverway-2024/" "Mehr erfahren" >}}
