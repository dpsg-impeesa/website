    headline: "Pfadilager Hanseradweg 2025 🇳🇱"
    text: Unser Pfadilager 2025 war eine unvergessliche Fahrradtour von Duisburg bis Amsterdam. Über elf ereignisreiche Tage erlebten wir - eine Gruppe von zwölf Personen, darunter zehn Pfadis und zwei Leiter - ein Abenteuer voller Herausforderungen, Gemeinschaftserlebnisse und kultureller Entdeckungen. Die Tour führte uns entlang des Rheins bis zur Niederländischen Grenze, weiter durch malerische Landschaften und historische Städte entlang der Ijsel und der Zuiderseen bis Nach Amsterdam. Insgesamt legten wir 370 Kilometer auf dem Fahrrad zurück.\n\n{{< popup-button "/news/hanseradweg-2025/" "Mehr erfahren" >}}
