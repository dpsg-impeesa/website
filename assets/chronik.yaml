    headline: "Dorfgauditunier 2025"
    text: Am Samstag, 28. Juni 2025 findet in Markelfingen das diesjjhrige Dorfgauditurnier statt. Gemeinsam mit dem SV Markelfingen sorgen wir als Pfadfinder dort für ein unterhaltsames Turnier in dem Teams in den Disziplinen Wasserbomben-Volleyball, menschliches Tischkicker und Bubble-Fußball gegeneinander antreten werden. Wir freuen uns auf einen Tag voller Spaß und guter Laune!\nDas Tunier get von 10:00 bis 17:00 Uhr und findet am Riedstadion in Markelfingen statt. Anschließend ist ab 18:00 Uhr Party mit Live Band.\n\n\n{{< popup-button "/news/dorfgauditunier-2025/" "Mehr erfahren" >}}
