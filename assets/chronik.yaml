    text: "Bereits kurz nach der Gründung nahm der Stamm am 28. April am ersten Gaulager teil."
  - date: 1956-09-07
    headline: "Erste Jungpfadfindersippe"
    text: "Am 7. September wurde die erste Jungpfadfindersippe gegründet."
  - date: 1956-09-21
