{{- $id := .Get "id" | default (.Get 0) | default  "dQw4w9WgXcQ" -}} 
{{- $thumb := .Get "thumb" | default (.Get 1) | default "/img/banner.webp" -}}

<a href="https://www.youtube.com/watch?v={{ $id }}" target="_blank">
  <div class="fake-embed" style="position: relative;  align-items: center;">
    <img class= "thumbnail" src="{{ $thumb }}" alt="YouTube Thumbnail", style=" position: relative; width: 100%; height: 100%;">
    <img class="icon" src="/img/YouTube_icon.svg" alt="YouTube Icon", style="position: absolute; top: 50%; right: 50%; width: 5rem; object-fit: contain; transform: translate(50%, -50%);">
  </div>
</a>
