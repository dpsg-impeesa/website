<script id="load-plausible">
    if (  navigator.doNotTrack || navigator.doNotTrack == "yes" || window.doNotTrack || navigator.globalPrivacyControl ) {
        console.log("Do Not Track is enabled - Plausible will not be loaded");
    }
    else {
        var plausible_main = document.createElement('script');
        plausible_main.type = 'text/javascript';
        plausible_main.async = false;
        plausible_main.src = '/plausible/js/script.js';
        document.head.appendChild(plausible_main);

        var plausible_window = document.createElement('script');
        plausible_window.innerHTML = `window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}}; plausible.init({endpoint:"/plausible/api/event"})`;
        document.head.appendChild(plausible_window);

	{{- if eq .Page.Kind "404" }}
	var plausible_404 = document.createElement('script');
        plausible_404.innerHTML = `plausible('404', { props: { path: document.location.pathname } });`;
        document.head.appendChild(plausible_404);
	{{- end }}
    }
    document.currentScript.remove();
</script>
