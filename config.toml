baseurl = "https://impeesa.steinr.eu/"
title = "DPSG Stamm Impeesa"
languageCode = "de"
DefaultContentLanguage = "de"
paginate = "5" # Number of posts per page
theme = ["hugo-cloak-email", "hugo-dpsg", "hugo-photoswipe-gallery"]

[permalinks]
  news = "/:year/:slug/"
 
# [Author] # Used in authorbox
#   name = "Scout Master"
#   bio = "The Scout Master is the leader of this local scout group"
#   avatar = "img/avatar.png"

[Params]
  description = "Welcome to our scout group!" # Site description. Used in meta description
  copyright = "DPSG local group" # Footer copyright holder, otherwise will use site title
  opengraph = true # Enable OpenGraph if true
  schema = true # Enable Schema
  twitter_cards = false # Enable Twitter Cards if true
  readmore = true # Show "Read more" button in list if true
  authorbox = false # Show authorbox at bottom of pages if true
  toc = false # Enable Table of Contents
  pager = true # Show pager navigation (prev/next links) at the bottom of pages if true
  indexPager = false # Show pager navigation on index page
  post_meta = ["author", "date", "categories", "translations"] # Order of post meta information
  mainSections = ["post", "blog", "news"] # Specify section pages to show on home page and the "Recent articles" widget
  dateformat = "02.01.2006" # Change the format of dates
  selfHosted = true # Use self-hosted fonts/js/css if true
  progressive_webapp = false # Enable Progressive Web App if true
  customPartial = "plausible.html" # Custom partial to include in head
  expanded_menu = false # always show menu items in expanded mode on mobile

[Params.style.vars]
  highlightColor = "#003056" # Override main theme color

[Params.logo]
  image = "/img/aufnaeher.webp" # Logo image. Path relative to "static"
  header = "/img/header.webp" # Header image. Path relative to "static"
  title = "DPSG Stamm Impeesa" # Logo title, otherwise will use site title
  subtitle = "Radolfzell/Markelfingen" # Logo subtitle
  image_alt = "DPSG Stamm Impeesa logo" # Logo alt text

[Params.sidebar]
  home = "right" # Configure layout for home page
  list = "right"  # Configure layout for list pages
  single = "right" # Configure layout for single pages
  # Enable widgets in given order
  widgets = ["recent", "categories", "taglist", "social"]
  # alternatively "ddg-search" can be used, to search via DuckDuckGo
  # widgets = ["ddg-search", "recent", "categories", "taglist", "social", "languages"]

[Params.widgets]
  recent_num = 5 # Set the number of articles in the "Recent articles" widget
  tags_counter = false # Enable counter for each tag in "Tags" widget

[Params.footer]
  text = "[Impressum und Datenschutz](/impressum)" # Extra text in footer row, understands markdown
  # right = "Donate!" # Right-aligned text in footer row, understands markdown



[Params.widgets.social]
  # Enable parts of social widget
  facebook = "dpsg.radolfzell.de"
  # twitter = "username"
  instagram = "dpsg_stamm_impeesa"
  # linkedin = "username"
  # elegram = "username"
  # github = "dpsg-impeesa"
  # gitlab = "username"
  # bitbucket = "username"
  # email = "info@dpsg-radolfzell.de"
  rss = "/news/index.xml"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[privacy]
  [privacy.disqus]
    disable = true
  [privacy.googleAnalytics]
    disable = true
  [privacy.instagram]
    disable = true
  [privacy.twitter]
    disable = true
  [privacy.vimeo]
    disable = true
  [privacy.youtube]
    disable = true